appId: com.iptvgenius.app
productName: IPTV Genius
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
asarUnpack:
  - resources/**
  - node_modules/ffmpeg-static/**
  - node_modules/better-sqlite3/**
win:
  target:
    - target: nsis
    - target: portable
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
npmRebuild: true
mac:
  target:
    - target: dmg
    - target: zip
  artifactName: ${productName}-${version}-${arch}.${ext}
  category: public.app-category.entertainment
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
